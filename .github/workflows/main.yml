name: Update profile README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_repos.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate top repositories
        env:
          GITHUB_USER: collabray
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOP_N: "6"
        run: python scripts/update_repos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update top repositories"
          git push
